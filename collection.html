<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>所有率チェッカー</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    }
    body {
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      color: #1f2937;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .sticky-header-container {
      position: sticky;
      top: 0;
      z-index: 1000;
      background-color: #f8fafc;
      padding-top: 4px;
      padding-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 8px 16px -4px rgba(248, 250, 252, 0.95);
    }

    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
      border: 1px solid #e2e8f0;
    }
    .top-nav-left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      background: #334155;
      color: #ffffff;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .page-title { font-size: 16px; font-weight: bold; color: #0f172a; }

    .summary-card {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #1e3a8a 100%);
      color: #ffffff;
      border-radius: 16px;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .summary-table { border-collapse: collapse; font-size: 16px; font-weight: bold; }
    .summary-table td { padding: 5px 16px; }

    .share-x-btn {
      display: inline-flex; align-items: center; gap: 8px; background: #000000; color: #ffffff;
      font-size: 14px; font-weight: bold; padding: 10px 22px; border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer; white-space: nowrap;
    }

    .action-controls-container { display: flex; justify-content: flex-start; gap: 10px; }
    .ctrl-action-btn { padding: 8px 18px; font-size: 13px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .ctrl-action-btn.select-all { background: #2563eb; color: #ffffff; border: none; }
    .ctrl-action-btn.deselect-all { background: #ffffff; color: #dc2626; border: 1.5px solid #fca5a5; }

    .view-tabs-container { display: flex; background: #e2e8f0; padding: 4px; border-radius: 12px; gap: 4px; }
    .view-tab-btn { flex: 1; padding: 10px 16px; font-size: 14px; font-weight: bold; text-align: center; background: transparent; border: none; border-radius: 8px; cursor: pointer; color: #64748b; }
    .view-tab-btn.active { background: #ffffff; color: #2563eb; }

    .collection-list { display: flex; flex-direction: column; gap: 16px; }
    .character-row { display: flex; align-items: center; gap: 16px; background: #ffffff; padding: 8px 12px; border-radius: 14px; border: 1px solid #e2e8f0; }

    .name-plate {
      position: relative; width: 280px; height: 68px; border-radius: 12px; background-size: cover; background-position: center; background-color: #2563eb;
      display: flex; align-items: center; padding: 6px 12px; gap: 12px; flex-shrink: 0;
    }
    .np-icon { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid #ffffff; }
    .np-character-name { font-size: 16px; font-weight: bold; color: #ffffff; }

    .card-icon-wrapper { position: relative; width: 58px; height: 58px; border-radius: 10px; cursor: pointer; flex-shrink: 0; }
    .card-main-icon { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; }
    .card-off-mask { position: absolute; top: -5px; left: -5px; right: -3px; bottom: -3px; background-color: rgba(255, 255, 255, 0.65); border-radius: 12px; }
    .card-icon-wrapper.active .card-off-mask { opacity: 0; pointer-events: none; }

    #loading { text-align: center; padding: 60px; color: #64748b; font-weight: bold; }

    /* スマホ画面対応 */
    @media screen and (max-width: 650px) {
      body { padding: 8px; }
      .summary-card { flex-direction: column; gap: 16px; padding: 16px; }
      .character-row { flex-direction: column; align-items: flex-start; gap: 10px; }
      .name-plate { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="sticky-header-container" id="stickyHeader">
      <div class="top-nav">
        <div class="top-nav-left">
          <a href="index.html" class="back-btn">← TOP</a>
          <span class="page-title">所有率チェッカー</span>
        </div>
      </div>

      <div class="collapsible-header-body">
        <div class="summary-card" id="summaryCard" style="display:none;">
          <table class="summary-table">
            <tr>
              <td>TOTAL</td>
              <td id="totalCount">0/0</td>
              <td id="totalPercent">0.0%</td>
            </tr>
          </table>
          <button class="share-x-btn" onclick="postToX()">ポストする</button>
        </div>

        <div class="action-controls-container" id="actionControls" style="display:none;">
          <button class="ctrl-action-btn select-all" onclick="selectAllCards(true)">✓ すべて選択</button>
          <button class="ctrl-action-btn deselect-all" onclick="selectAllCards(false)">✕ すべて解除</button>
        </div>
      </div>
    </div>

    <div id="loading">データを読み込み中...</div>
    <div class="collection-list" id="collectionList" style="display:none;"></div>
  </div>

  <script>
    let globalCharacters = [];
    let ownedCardState = {};

    window.onload = function() {
      const GAS_ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbxequWJqOweGHAQZYx6lDqEU5gZXFlAyPi0f5zlPQFYPn_xJRL1ROyxsqUvBjJcV50w/exec?action=getCollectionPageData';

      fetch(GAS_ENDPOINT_URL, { method: 'GET', redirect: 'follow' })
        .then(res => res.json())
        .then(data => {
          if (data.error) console.error(data.message);
          else initPage(data);
        })
        .catch(err => console.error('通信エラー:', err));
    };

    function initPage(res) {
      if (!res) return;
      globalCharacters = res.characters || [];
      document.getElementById('loading').style.display = 'none';
      document.getElementById('summaryCard').style.display = 'flex';
      document.getElementById('actionControls').style.display = 'flex';
      document.getElementById('collectionList').style.display = 'flex';
      renderCollectionList();
    }

    function renderCollectionList() {
      const listContainer = document.getElementById('collectionList');
      listContainer.innerHTML = '';

      globalCharacters.forEach(char => {
        const row = document.createElement('div');
        row.className = 'character-row';

        const npHtml = `
          <div class="name-plate" style="${char.character_plate ? `background-image: url('${escapeHtml(char.character_plate)}');` : ''}">
            ${char.icon ? `<img src="${escapeHtml(char.icon)}" class="np-icon">` : ''}
            <span class="np-character-name">${escapeHtml(char.character)}</span>
          </div>
        `;

        let cardsHtml = '<div style="display:flex; gap:8px; flex-wrap:wrap; flex:1;">';
        (char.cards || []).forEach(card => {
          if (ownedCardState[card.id] === undefined) ownedCardState[card.id] = false;
          const isOwned = !!ownedCardState[card.id];

          cardsHtml += `
            <div class="card-icon-wrapper ${isOwned ? 'active' : ''}" data-card-id="${card.id}" onclick="toggleCardOwnership(${card.id})">
              <img src="${escapeHtml(card.icon)}" class="card-main-icon" alt="card">
              <div class="card-off-mask"></div>
            </div>
          `;
        });
        cardsHtml += '</div>';

        row.innerHTML = npHtml + cardsHtml;
        listContainer.appendChild(row);
      });
    }

    function toggleCardOwnership(cardId) {
      ownedCardState[cardId] = !ownedCardState[cardId];
      renderCollectionList();
    }

    function selectAllCards(selectState) {
      globalCharacters.forEach(char => {
        (char.cards || []).forEach(card => { ownedCardState[card.id] = selectState; });
      });
      renderCollectionList();
    }

    function postToX() {
      const tweetText = "ホロメン所有率チェッカー\n" + window.location.href;
      window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(tweetText), '_blank');
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  </script>
</body>
</html>
