<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホロドリ メンバー情報</title>
  <style>
    /* （CSS部分は変更なし） */
    * { box-sizing: border-box; font-family: "Helvetica Neue", Arial, sans-serif; }
    body { margin: 0; padding: 0; background-color: #f8fafc; color: #1f2937; min-height: 100vh; display: flex; flex-direction: column; }
    .header { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 24px 20px; text-align: center; border-bottom: 1px solid #334155; }
    .header h1 { margin: 0; font-size: 26px; font-weight: 900; color: #f8fafc; }
    .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 40px; flex: 1; width: 100%; display: flex; flex-direction: column; gap: 24px; }
    .top-main-banner-container { width: 100%; display: none; padding: 28px 0; text-align: center; }
    .top-main-banner-img { max-width: 100%; height: auto; transform: scale(1.18); }
    .nav-list { display: flex; flex-direction: column; gap: 20px; }
    .nav-card { background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #1e3a8a 100%); border: 1.5px solid rgba(191, 219, 254, 0.6); border-radius: 24px; padding: 20px 28px; text-decoration: none; color: #ffffff; display: flex; align-items: center; gap: 28px; }
    .card-banner-box { width: 220px; height: 90px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .card-banner-img { width: 100%; height: 100%; object-fit: contain; }
    .card-text-content { flex: 1; }
    .card-title { font-size: 28px; font-weight: 900; margin-bottom: 6px; }
    .card-desc { font-size: 13.5px; color: #94a3b8; }
    footer { text-align: center; padding: 20px; font-size: 12px; color: #94a3b8; background: #ffffff; }
  </style>
</head>
<body>

  <div class="header">
    <h1>ホロドリ メンバー情報</h1>
  </div>

  <div class="container">
    <div class="top-main-banner-container" id="topMainBannerBox">
      <img id="top_main_banner_img" class="top-main-banner-img" src="" alt="TOP Banner">
    </div>

    <div class="nav-list">
      <a href="talent.html" class="nav-card">
        <div class="card-banner-box">
          <img id="banner_talent" class="card-banner-img" src="" alt="タレント一覧">
        </div>
        <div class="card-text-content">
          <div class="card-title">タレント一覧</div>
          <div class="card-desc">タレント毎にメンバーをまとめた一覧</div>
        </div>
      </a>

      <a href="holomen.html" class="nav-card">
        <div class="card-banner-box">
          <img id="banner_member" class="card-banner-img" src="" alt="メンバー一覧">
        </div>
        <div class="card-text-content">
          <div class="card-title">メンバー一覧</div>
          <div class="card-desc">全タレントのメンバーを名称、レアリティ、タイプ、スキル効果などで検索できるリスト</div>
        </div>
      </a>

      <a href="collection.html" class="nav-card">
        <div class="card-banner-box">
          <img id="banner_checker" class="card-banner-img" src="" alt="所有率チェッカー">
        </div>
        <div class="card-text-content">
          <div class="card-title">所有率チェッカー</div>
          <div class="card-desc">所有しているメンバーの所有率を確認＆ポストできる</div>
        </div>
      </a>
    </div>
  </div>

  <footer>&copy; 攻略データまとめサイト</footer>

  <script>
    // 公開した banner シートの CSV URL に置き換えてください
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT9i1dLEAM5pGk_jAXCtSAf0ZZ_HHFfukMIOkBL85fmZVzgu-MmTM6LeV_IsMNWz82fReASMesOA_MK/pub?gid=78052298&single=true&output=csv';

    window.onload = function() {
      fetch(CSV_URL)
        .then(response => response.text())
        .then(csvText => {
          const bannerMap = parseCsvToBannerMap(csvText);
          setBanners(bannerMap);
        })
        .catch(err => console.error('CSV取得エラー:', err));
    };

    // 簡易CSVパース処理（1行目をヘッダーとして処理）
    function parseCsvToBannerMap(csvText) {
      const lines = csvText.split(/\r\n|\n/).filter(line => line.trim() !== '');
      if (lines.length < 2) return {};

      const headers = lines[0].split(',').map(h => h.replace(/^"(.*)"$/, '$1').trim());
      const nameIdx = headers.findIndex(h => ['name', '機能名', 'title', '項目'].includes(h));
      const urlIdx = headers.findIndex(h => ['banner_url', 'bannerurl', 'url', 'image'].includes(h));

      const bannerMap = {};
      for (let i = 1; i < lines.length; i++) {
        const row = lines[i].split(',').map(cell => cell.replace(/^"(.*)"$/, '$1').trim());
        const name = nameIdx !== -1 ? row[nameIdx] : row[0];
        const url = urlIdx !== -1 ? row[urlIdx] : row[1];
        if (name) bannerMap[name] = url;
      }
      return bannerMap;
    }

    function setBanners(bannerMap) {
      if (!bannerMap) return;

      const getUrl = (keys) => {
        for (let k of keys) {
          if (bannerMap[k]) return bannerMap[k];
        }
        return '';
      };

      const topMainUrl = getUrl(['TOP', 'top', 'メイン', 'メインバナー', 'top_banner']);
      if (topMainUrl) {
        document.getElementById('top_main_banner_img').src = topMainUrl;
        document.getElementById('topMainBannerBox').style.display = 'block';
      }

      const talentUrl = getUrl(['タレント一覧', 'タレント 一覧', 'タレント', 'メンバー詳細カード一覧']);
      const memberUrl = getUrl(['メンバー一覧', 'メンバー 一覧', 'メンバー', 'ホロメンデータ一覧表']);
      const checkerUrl = getUrl(['所有率チェッカー', '所持状況コレクション', '所有率', 'チェッカー']);

      if (talentUrl) document.getElementById('banner_talent').src = talentUrl;
      if (memberUrl) document.getElementById('banner_member').src = memberUrl;
      if (checkerUrl) document.getElementById('banner_checker').src = checkerUrl;
    }
  </script>
</body>
</html>
